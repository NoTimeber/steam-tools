# 发版时构建 Docker 镜像,推到 GitHub 容器仓库(ghcr.io/<owner>/steam-tools)。服务器只拉镜像,不在服务器上构建。
#
# - 推 v* 标签时触发,镜像标签:1.6.1、1.6、latest。
# - 也可以在 Actions 页面手动跑:在分支上跑只打分支名标签(如 main),不动 latest。
# - 只出 linux/amd64。arm64 出不了:lzma-native 8.0.6 包里的 linux-arm64 预编译文件其实是 x86-64 的,
#   arm64 上会退回源码编译,镜像里没有编译工具。
name: 构建镜像

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 镜像名必须小写,仓库主人名可能有大写
      - name: 镜像名
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/steam-tools" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 依赖没变时 npm ci 那几层直接用上次的缓存
          cache-from: type=gha
          cache-to: type=gha,mode=max
