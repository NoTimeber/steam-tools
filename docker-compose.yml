services:
  steam-tools:
    build: .
    image: steam-tools:latest
    container_name: steam-tools
    restart: unless-stopped
    # tini 做 PID 1,docker stop 的 SIGTERM 能传到 node,让它先登出 Steam 会话再退出
    init: true
    stop_grace_period: 15s
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 53110
      # 反代经 docker bridge 网络进来(172.16/12 等),要信任它转发的 X-Forwarded-*
      TRUST_PROXY: loopback,uniquelocal
    volumes:
      # 加密数据库 steam-tools.db 和其它运行数据。宿主目录需属于 uid 1000(容器内 node 用户)
      - ./data:/data
    secrets:
      # 主密钥:解开数据库里的密码/令牌全靠它。和 data/ 分开备份,丢了数据就解不开
      - master_key
    ports:
      # 只绑本机,公网只能经反代(HTTPS)访问
      - "127.0.0.1:53110:53110"

secrets:
  master_key:
    file: ./secrets/master.key
