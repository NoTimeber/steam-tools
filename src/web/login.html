<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Steam 工具台</title>
  <style>
    /* 配色和前端(web/src/styles.css)一致:锌灰 + 琥珀色,浅色 / 深色跟随系统 */
    :root {
      color-scheme: light;
      --bg: #f4f4f5;
      --card: #ffffff;
      --line: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --label: #3f3f46;
      --input-bg: #ffffff;
      --accent: #d97706;
      --accent-hover: #f59e0b;
      --on-accent: #ffffff;
      --accent-ring: rgba(217, 119, 6, 0.28);
      --danger: #dc2626;
      --shadow: 0 1px 2px rgba(9, 9, 11, 0.05), 0 12px 32px rgba(9, 9, 11, 0.06);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --card: #18181b;
        --line: #2e2e33;
        --text: #fafafa;
        --muted: #a1a1aa;
        --label: #d4d4d8;
        --input-bg: #09090b;
        --accent: #f59e0b;
        --accent-hover: #fbbf24;
        --on-accent: #18181b;
        --accent-ring: rgba(245, 158, 11, 0.3);
        --danger: #f87171;
        --shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 360px;
      max-width: calc(100vw - 32px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      animation: card-in 0.32s var(--ease) both;
    }
    @keyframes card-in {
      from { transform: translateY(14px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    .brand-mark .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-ring);
    }
    h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
    p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--label); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.16s var(--ease), box-shadow 0.16s var(--ease);
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 11px 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.16s var(--ease), transform 0.16s var(--ease);
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: default; }
    .err { margin-top: 12px; color: var(--danger); font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <div class="brand-mark"><span class="dot"></span>安全访问</div>
    <h1>Steam 工具台</h1>
    <p class="sub" id="sub">请输入访问口令</p>
    <label for="password" id="password-label">口令</label>
    <input id="password" type="password" autocomplete="current-password" autofocus>
    <div id="confirm-wrap" style="display:none">
      <label for="confirm" style="margin-top:14px">确认口令</label>
      <input id="confirm" type="password" autocomplete="new-password">
      <label for="setup-token" style="margin-top:14px">初始化令牌</label>
      <input id="setup-token" type="text" autocomplete="off" spellcheck="false" placeholder="见服务端启动日志(docker compose logs)">
    </div>
    <button type="submit" id="submit-btn">登录</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const form = document.getElementById('login-form');
    const pwd = document.getElementById('password');
    const confirm = document.getElementById('confirm');
    const confirmWrap = document.getElementById('confirm-wrap');
    const setupTokenInput = document.getElementById('setup-token');
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('err');
    const sub = document.getElementById('sub');
    const pwdLabel = document.getElementById('password-label');
    let setupMode = false;

    // 检测是否已设置口令。如果未设置(或请求失败/网络错误)，默认进入"首次设置"模式，
    // 避免用户看到登录页却无处设置口令。
    (async () => {
      try {
        const resp = await fetch('/api/auth/status');
        const data = await resp.json().catch(() => null);
        if (data && data.configured === true) {
          return; // 已有口令，保持登录模式
        }
      } catch (ex) {
        console.warn('auth/status 请求失败:', ex.message);
      }
      // 未配置 或 检测失败：进入设置模式
      setupMode = true;
      sub.textContent = '首次使用,请设置访问口令(至少 8 位)';
      pwdLabel.textContent = '新口令';
      pwd.setAttribute('autocomplete', 'new-password');
      confirmWrap.style.display = '';
      btn.textContent = '设置口令并进入';
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      if (setupMode && pwd.value !== confirm.value) {
        err.textContent = '两次输入的口令不一致';
        return;
      }
      btn.disabled = true;
      try {
        const url = setupMode ? '/api/auth/setup' : '/api/auth/login';
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(setupMode
            ? { password: pwd.value, setupToken: setupTokenInput.value.trim() }
            : { password: pwd.value })
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok && data.success) {
          window.location.href = '/';
          return;
        }
        err.textContent = data.error || ((setupMode ? '设置失败' : '登录失败') + ' (HTTP ' + resp.status + ')');
      } catch (ex) {
        err.textContent = '网络错误: ' + ex.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
